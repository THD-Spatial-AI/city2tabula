# Compose derives the project name from the containing directory, which would
# make this "http" and collide with any sibling repo using the same layout.
# Volume and network names are built from it, so it is pinned here.
name: city2tabula

services:
  city2tabula-cli:
    container_name: city2tabula-cli
    build:
      context: ./../..
      dockerfile: environment/Dockerfile
    env_file: docker.env        # load environment variables into container
    stdin_open: true
    tty: true
    working_dir: /app
    volumes:
      - ./../../data:/app/data        # mount full project for development
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux compatibility
    command: bash         # start an interactive shell for development

  city2tabula-db:
    image: postgis/postgis:16-3.4
    container_name: city2tabula-db
    environment:
      POSTGRES_USER: ${C2T_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${C2T_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${C2T_DB_NAME:-city2tabula}
    # No host port published: the city2tabula service reaches this over the
    # compose default network by service name. Add one back if a host tool
    # (psql, QGIS) needs direct access.
    volumes:
      - city2tabula-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

  # The on-request HTTP wrapper (cmd/server), for TentaCron's proxy targets to
  # reach. The same image also carries the CLI, so it can be run one-shot as a
  # pipeline job without a second artefact.
  city2tabula:
    container_name: city2tabula
    # Dockerfile.runtime, not Dockerfile: this runs compiled binaries on a JRE
    # base, where the interactive service needs the full toolchain image.
    # With both image and build set, `compose up` builds locally and tags the
    # result, while `compose pull` fetches the published tag instead. A
    # deployment pins C2T_IMAGE_TAG to a release rather than tracking latest.
    image: ghcr.io/thd-spatial-ai/city2tabula-server:${C2T_IMAGE_TAG:-latest}
    build:
      context: ./../..
      dockerfile: environment/Dockerfile.runtime
    environment:
      DB_HOST: city2tabula-db
      DB_PORT: 5432
      DB_USER: ${C2T_DB_USER:-postgres}
      DB_PASSWORD: ${C2T_DB_PASSWORD:-postgres}
      DB_NAME: ${C2T_DB_NAME:-city2tabula}
      DB_SSL_MODE: disable
      SERVER_PORT: 5000
      # PYLOVO_FDW_HOST intentionally unset: no PyLovo dataset behind this
      # instance, leaves PyLovo linking a clean no-op (internal/process/pylovo_fdw.go).
    # The dataset directories specifically, not data/ as a whole: the image
    # bakes data/tabula, and mounting the parent would hide it behind the host's
    # copy. A deployment then needs no TABULA files on the host at all, which is
    # the configuration the image is built for and this file has to exercise.
    volumes:
      - ./../../data/lod2:/app/data/lod2
      - ./../../data/lod3:/app/data/lod3
    depends_on:
      city2tabula-db:
        condition: service_healthy
    ports:
      - "${C2T_SERVER_HOST_PORT:-5050}:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5000/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    # default is listed explicitly because naming any network here drops the
    # implicit default membership, which is how city2tabula-db is reached.
    networks:
      default: {}
      tentacron-net:
        # Former container name, kept until TentaCron's proxy targets use
        # "city2tabula".
        aliases:
          - city2tabula-server

volumes:
  city2tabula-db-data:

# A cross-repo caller reaches city2tabula by attaching to this project's
# network, rather than this file joining one another repo owns. Depending on
# another project's network meant depending on its project name, which is a side
# effect of its directory rather than anything it promised to keep: ignis renamed
# its projects and the network named here stopped existing, with nothing to
# notice. An external network that is absent fails the whole stack at `up`.
networks:
  default: {}
  # The shared heat-stack network, which the other services reach this one over.
  # Declared with an explicit name rather than external: true, so whichever
  # stack starts first creates it and the rest attach; this file still comes up
  # on its own, which an external declaration would prevent.
  #
  # The key must stay spelled as the network name. Compose matches it against
  # the network's own com.docker.compose.network label, so a different key with
  # a name override joins a second network instead of failing.
  tentacron-net:
    name: tentacron-net
