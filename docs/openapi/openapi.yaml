openapi: 3.0.3

info:
  title: City2TABULA API
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: |
    City2TABULA extracts 3D building geometry and TABULA/EPISCOPE building-energy
    attributes from CityGML/CityJSON source data into PostgreSQL/PostGIS. This API
    triggers extraction on request for a country and bounding box, then serves the
    result: building attributes, per-surface envelope data, and (separately)
    footprint geometry.

    ## Workflow

    1. `GET /coverage` cheap check for whether a bbox already has data.
    2. `POST /runs` if not, trigger extraction for that country/bbox. Returns a
       `run_id` immediately; extraction runs in the background.
    3. `GET /runs/{id}` poll until `status` is `completed`, `no_data`, or `failed`.
    4. `GET /buildings` read building + surface attributes, once data exists.
    5. `GET /geometry` read footprint geometry, only if something needs to render it.

    `buildings` never carries geometry, and `geometry` never carries thematic
    attributes they're separate endpoints on purpose, since nothing in a
    calculation pipeline needs geometry, only a visualization consumer does.

    ## Per-country databases

    Each country's raw 3D data lives in its own database, created on first use.
    A `country` value must match one of City2TABULA's supported TABULA/EPISCOPE
    countries (e.g. `germany`, `united_kingdom`) see `internal/config/srid.go`
    in the source repository for the full list.

    ## Authentication

    None. This API has no authentication of its own and is not behind a reverse
    proxy it is meant to be reachable only from trusted internal callers on the
    same network. Do not expose it directly to the public internet as-is.

    ## Surface measurement references

    - Freeman, H. and Shapira, R. (1975). Determining the minimum-area encasing
      rectangle for an arbitrary closed curve. Communications of the ACM 18(7),
      409-413. https://doi.org/10.1145/360881.360919
    - Gröger, G., Kolbe, T. H., Nagel, C. and Häfele, K.-H. (2012). OGC City
      Geography Markup Language (CityGML) Encoding Standard 2.0, OGC 12-019.
    - Labetski, A., Vitalis, S., Biljecki, F., Arroyo Ohori, K. and Stoter, J.
      (2023). 3D building metrics for urban morphology. International Journal of
      Geographical Information Science 37(1), 36-67.
      https://doi.org/10.1080/13658816.2022.2103818
    - Ledoux, H. (2018). val3dity: validation of 3D GIS primitives according to
      the international standards. Open Geospatial Data, Software and Standards
      3, 1. https://doi.org/10.1186/s40965-018-0043-x
    - SIG3D. CityGML Energy ADE, feature catalogue, ThermalBoundary.
      https://www.sig3d.org/citygml/2.0/energy/0.8.0/FeatureCatalogue/html/energy_ThermalBoundary.html
    - Tampieri, F. (1992). Newell's method for computing the plane equation of a
      polygon. In D. Kirk (ed.), Graphics Gems III, Academic Press, 231-232.

    ## Run tracking

    Run state is held in memory only, not persisted. A server restart loses
    in-flight run records; the ground truth after a successful run is the
    `building_link` table itself, so a lost run record just means re-checking
    `coverage` and re-triggering if still needed.

servers:
  - url: http://localhost:5000
    description: Local default (SERVER_PORT env var overrides the port)

security: []

paths:
  /api/v1/health:
    get:
      summary: Liveness check
      operationId: health
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/runs:
    post:
      summary: Trigger a bbox-scoped extraction run
      operationId: triggerRun
      description: |
        Starts import → extract → link for one country/bbox in the background and
        returns immediately with a run id to poll via `GET /runs/{id}`. Runs are
        serialized only one runs at a time across all countries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "202":
          description: Run accepted and started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          description: Missing/invalid country, or an unsupported country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/runs/{id}:
    get:
      summary: Poll a run's status
      operationId: getRunStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The `run_id` returned by `POST /runs`
      responses:
        "200":
          description: Current run state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: No run with this id (never existed, or the server restarted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/coverage:
    get:
      summary: Count already-linked buildings in a bbox
      operationId: getCoverage
      description: |
        Read-only check against `building_link` a nonzero count means the bbox
        already has extracted, PyLovo-link-processed data, so triggering a new run
        is probably unnecessary.
      parameters:
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/Xmin"
        - $ref: "#/components/parameters/Ymin"
        - $ref: "#/components/parameters/Xmax"
        - $ref: "#/components/parameters/Ymax"
      responses:
        "200":
          description: Count of already-linked buildings in the bbox
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 42
        "400":
          description: Missing/invalid country or bbox parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/buildings:
    get:
      summary: Building attributes and envelope surfaces
      operationId: getBuildings
      description: |
        Returns thematic (non-geometric) 3D attributes, with each building's
        envelope surfaces embedded. Two mutually exclusive query modes
        `osm_ids` takes precedence if both are supplied:

        - **By `osm_ids`**: only buildings already matched to a PyLovo building
          via `building_link` (`osm_id`/`match_type` populated).
        - **By bbox**: every building whose footprint intersects the bbox,
          independent of whether a PyLovo link exists yet (`osm_id` empty,
          `match_type` 0 on every result).
      parameters:
        - $ref: "#/components/parameters/Country"
        - name: osm_ids
          in: query
          schema:
            type: string
          description: Comma-separated PyLovo OSM building ids
          example: "123456,789012"
        - $ref: "#/components/parameters/Xmin"
        - $ref: "#/components/parameters/Ymin"
        - $ref: "#/components/parameters/Xmax"
        - $ref: "#/components/parameters/Ymax"
      responses:
        "200":
          description: Matching buildings and the credit of every dataset they come from (both empty if none matched)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildingsResponse"
        "400":
          description: Missing country, or neither osm_ids nor a full bbox given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Database query failed, or a returned dataset has no stored credit. Not retryable until the database is fixed (run `c2t -sync-attribution` for a missing credit).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/geometry:
    get:
      summary: Building footprint geometry
      operationId: getGeometry
      description: |
        Footprint geometry only, for the given building object ids fetched
        separately from `/buildings` since nothing in the calculation path needs
        it, only a visualization consumer would.
      parameters:
        - $ref: "#/components/parameters/Country"
        - name: object_ids
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated City2TABULA building object ids
          example: "DEHB01AL3AU0004T,DEHB01ALf0000SC4"
      responses:
        "200":
          description: Footprint geometry per building and the credit of every dataset it comes from (both empty if none matched)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeometryResponse"
        "400":
          description: Missing country or object_ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Database query failed, or a returned dataset has no stored credit. Not retryable until the database is fixed (run `c2t -sync-attribution` for a missing credit).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


components:
  parameters:
    Country:
      name: country
      in: query
      required: true
      schema:
        type: string
      description: Normalized, lowercase country name (e.g. `germany`, `united_kingdom`)
      example: germany
    Xmin:
      name: xmin
      in: query
      schema:
        type: number
        format: double
      description: WGS84 (EPSG:4326) bbox minimum longitude
    Ymin:
      name: ymin
      in: query
      schema:
        type: number
        format: double
      description: WGS84 (EPSG:4326) bbox minimum latitude
    Xmax:
      name: xmax
      in: query
      schema:
        type: number
        format: double
      description: WGS84 (EPSG:4326) bbox maximum longitude
    Ymax:
      name: ymax
      in: query
      schema:
        type: number
        format: double
      description: WGS84 (EPSG:4326) bbox maximum latitude

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    RunRequest:
      type: object
      required: [country]
      properties:
        country:
          type: string
          example: germany
        xmin:
          type: number
          format: double
        ymin:
          type: number
          format: double
        xmax:
          type: number
          format: double
        ymax:
          type: number
          format: double
        bbox_mode:
          type: string
          enum: [intersects, contains, on_tile]
          default: intersects
          description: citydb-tool's spatial filter mode for the bbox

    Run:
      type: object
      properties:
        run_id:
          type: string
          format: uuid
        country:
          type: string
        status:
          type: string
          enum: [pending, running, completed, no_data, failed]
          description: |
            `no_data` means the pipeline ran successfully but found no source data
            for the requested bbox distinct from `failed`, a real error.
        error:
          type: string
          description: Present only when status is `failed`

    BuildingsResponse:
      type: object
      required: [buildings, attributions]
      properties:
        buildings:
          type: array
          items:
            $ref: "#/components/schemas/Building"
        attributions:
          type: array
          description: One entry per dataset in `buildings`, plus TABULA when any building has a `tabula_variant_code`
          items:
            $ref: "#/components/schemas/DatasetCredit"

    GeometryResponse:
      type: object
      required: [buildings, attributions]
      properties:
        buildings:
          type: array
          items:
            $ref: "#/components/schemas/BuildingGeometry"
        attributions:
          type: array
          description: One entry per dataset in `buildings`
          items:
            $ref: "#/components/schemas/DatasetCredit"

    DatasetCredit:
      type: object
      description: A source dataset's attribution. Show `credit` with any output derived from the dataset.
      required: [dataset_id, provider, dataset, licence, licence_url, credit, changes]
      properties:
        dataset_id:
          type: string
          example: de-bavaria-lod2
        provider:
          type: string
        dataset:
          type: string
        licence:
          type: string
          description: SPDX licence id, or LicenseRef-<id> for a licence not on the SPDX list
          example: CC-BY-4.0
        licence_url:
          type: string
        credit:
          type: string
          description: Credit line exactly as the provider requires it
        credit_url:
          type: string
          description: Link the credit carries; absent when the provider names none
        terms_url:
          type: string
          description: Provider's terms of use; absent when not separate from the licence
        changes:
          type: string
          description: What City2TABULA does to the data

    Building:
      type: object
      description: One LOD2 building's thematic 3D attributes, no geometry.
      properties:
        object_id:
          type: string
          description: Object id of the CityGML Building, never of one of its BuildingParts.
        dataset_id:
          type: string
          description: Source dataset; its credit is in the response's `attributions`
        osm_id:
          type: string
          description: Empty when this result came from the bbox query mode
        match_type:
          type: integer
          description: 0 when unlinked (bbox mode); PyLovo match type otherwise
        min_height:
          type: number
          nullable: true
        max_height:
          type: number
          nullable: true
        room_height:
          type: number
          nullable: true
          description: Metres. TABULA's 2.5 m reference room height, used for ventilation volume; not a measured value.
        number_of_storeys:
          type: integer
          nullable: true
          description: |
            Storeys below the eave (eave height / 2.8 m floor-to-floor, rounded) plus one when the roof
            space reaches 2 m clear height. The method, its sources and its validation are in the
            City2TABULA documentation, SQL pipeline, script 06.
        footprint_area:
          type: number
          nullable: true
        area_total_roof:
          type: number
          nullable: true
        area_total_wall:
          type: number
          nullable: true
          description: |
            Square metres. Envelope wall area: the exterior wall pieces, without the
            parts shared with attached neighbours (`area_party_wall`).
        area_party_wall:
          type: number
          nullable: true
          description: |
            Square metres. Wall area shared with attached neighbours, left out of
            `area_total_wall` because a heated neighbour means almost no heat flow.
            Add it back with a reduction factor when a neighbour is unheated.
        area_total_floor:
          type: number
          nullable: true
        tabula_variant_code:
          type: string
          nullable: true
        surfaces:
          type: array
          items:
            $ref: "#/components/schemas/Surface"
        has_attached_neighbour:
          type: boolean
          nullable: true
          description: |
            True when the building shares a wall with at least one other building:
            their footprints lie within 0.1 m of each other along at least 1 m of
            boundary. Buildings that meet only at a corner are not attached.
        attached_neighbour_class:
          type: integer
          nullable: true
          enum: [0, 1, 2]
          description: |
            Number of attached neighbours as TABULA's attached-neighbours code:
            0 detached, 1 one neighbour (semi-detached or end of terrace), 2 two
            or more (mid-terrace or block).
        attached_neighbour_id:
          type: array
          items:
            type: string
          description: |
            `object_id` of each attached neighbour. Pass them to `GET /geometry`
            to draw the neighbours. Absent when the building has none.

    Surface:
      type: object
      description: |
        One envelope face (wall, roof or ground) of a building. Measurements are
        taken from the LoD2 model geometry; references are listed under
        "Surface measurement references" at the top of this document. Where part
        of a face lies against another solid of the same building, `area`,
        `length`, `width` and `height` describe only its exposed piece. A wall
        shared with an attached neighbour is served as separate pieces: the
        exterior part and the shared part, the latter with `is_party_wall`.
      properties:
        id:
          type: string
          description: |
            Identifier of this face, unique per face. One CityGML surface can
            consist of several faces, each with its own `id`.
        type:
          type: string
          description: |
            CityGML 2.0 thematic boundary surface the face belongs to (OGC 12-019).
          enum: [WallSurface, RoofSurface, GroundSurface]
        area:
          type: number
          nullable: true
          description: |
            Square metres. Area of the face measured in its own plane, holes
            excluded: the face is rotated flat along its normal (Newell's method,
            Tampieri 1992) before measuring, so a sloped roof gives its true area,
            not the smaller area seen from above. Corresponds to the Energy ADE
            ThermalBoundary `area`; LoD2 models carry no window openings.
        azimuth:
          type: number
          nullable: true
          description: |
            Degrees. Compass direction the outward face normal points to,
            clockwise from grid north: 0 north, 90 east, 180 south, 270 west, as
            in the Energy ADE ThermalBoundary `azimuth`. -1 means undefined and is
            given for faces within about 10 degrees of horizontal (`tilt` 90),
            which face no direction; the Energy ADE uses 0 for that case.
        tilt:
          type: number
          nullable: true
          description: |
            Degrees. Angle between the face and the vertical: 0 for a vertical
            wall, 90 for a horizontal face such as a flat roof. Faces within about
            10 degrees of horizontal are reported as 90. This is the complement
            of the Energy ADE ThermalBoundary `inclination` (0 for a horizontal
            plane): inclination = 90 - tilt.
        length:
          type: number
          nullable: true
          description: |
            Metres. Long side of the smallest-area rectangle enclosing the face,
            measured in the face's own plane (Freeman and Shapira 1975; the length
            of the object-oriented bounding box in Labetski et al. 2023). For a
            pitched roof face this follows the slope, not its projection on the
            ground. Null for faces other than walls, roofs and ground.
        width:
          type: number
          nullable: true
          description: |
            Metres. Short side of the same rectangle as `length`. 0 for a
            degenerate face. For a face that is not a rectangle (a gable wall, a
            hipped roof facet, an L-shaped ground face), length x width is larger
            than `area`. Null for faces other than walls, roofs and ground.
        height:
          type: number
          nullable: true
          description: |
            Metres. Vertical extent of the face, highest minus lowest point (the
            height range of Labetski et al. 2023, per face). For a wall, its
            height; for a gable wall, up to the ridge; for a pitched roof face, the
            rise from eave to ridge, not the length along the slope; about 0 for a
            flat roof or ground face.
        area_below_precision:
          type: boolean
          nullable: true
          description: |
            True when `area` rounds to 0.00 square metres at the 2-decimal
            precision City2TABULA records, typically a sliver where a wall meets a
            roof. The face is real and can be drawn, but its area must not be used
            as a thermal area.
        is_valid:
          type: boolean
          nullable: true
          description: |
            OGC Simple Features validity of the face, tested on its 2D outline seen
            from above (PostGIS ST_IsValid). A vertical wall seen from above is a
            line, so walls are usually false; the flag does not report 3D validity
            in the sense of ISO 19107 (Ledoux 2018).
        is_planar:
          type: boolean
          nullable: true
          description: |
            True when all vertices of the face lie exactly in one plane, tested
            without tolerance (PostGIS ST_IsPlanar). Coordinate rounding in source
            data makes many real roof faces false. `area`, `tilt` and `azimuth`
            use a best-fit plane either way.
        is_party_wall:
          type: boolean
          nullable: true
          description: |
            True for a piece of wall that lies against a wall of the attached
            neighbour `neighbour_object_id`. Not part of the building's
            `area_total_wall`. A heated neighbour transmits almost no heat through
            it (BuEM: `b_transmission` 0). Each side of the shared wall has its own
            piece, so two polygons lie on top of each other.
        neighbour_object_id:
          type: string
          nullable: true
          description: |
            `object_id` of the neighbour sharing this party-wall piece; absent on
            exterior pieces.

    BuildingGeometry:
      type: object
      properties:
        object_id:
          type: string
          description: Object id of the CityGML Building, never of one of its BuildingParts.
        dataset_id:
          type: string
          description: Source dataset; its credit is in the response's `attributions`
        footprint_geojson:
          type: object
          nullable: true
          description: GeoJSON geometry (MultiPolygon), native SRID (see the building's country)
        surfaces:
          type: array
          description: Present when surfaces were requested.
          items:
            $ref: "#/components/schemas/SurfaceGeometry"

    SurfaceGeometry:
      type: object
      description: |
        One served surface piece's polygon, keyed by the same `id` as in `Surface`.
        Party-wall pieces carry `is_party_wall`, so a viewer can highlight them.
      properties:
        id:
          type: string
        type:
          type: string
          enum: [WallSurface, RoofSurface, GroundSurface]
        is_party_wall:
          type: boolean
          nullable: true
        neighbour_object_id:
          type: string
          nullable: true
        geojson:
          type: object
          nullable: true
          description: GeoJSON geometry (Polygon with Z), native SRID
