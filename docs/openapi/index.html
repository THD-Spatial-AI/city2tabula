<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>City2TABULA API reference</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
    <style>
      body { margin: 0; padding: 0; }
    </style>
  </head>
  <body>
    <!-- Swagger UI via CDN, deliberately unpinned: docs-only page, no build
         step. Standalone so a dev can open this file directly without
         running `mkdocs serve` first. Renders openapi.yaml directly, which
         stays the single source of truth. -->
    <div id="swagger-ui"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      window.onload = () => {
        window.ui = SwaggerUIBundle({
          url: "./openapi.yaml",
          dom_id: "#swagger-ui",
        });
      };
    </script>
  </body>
</html>
